name: E2E

# Playwright end-to-end tests for the critical user flows (search, quiz, compare)
# against a real production build. Runs on every PR except docs-only ones — this is
# NOT a required check (only ci + preflight are), so skipping it can't block a merge.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser + OS deps
        # `--with-deps` runs apt-get update, which intermittently fails on the runner's
        # preinstalled Microsoft/Azure apt repos (bad InRelease / NOSPLIT). Drop those
        # third-party sources so apt only hits Ubuntu mirrors, and retry on transient blips.
        run: |
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt ${attempt} failed; retrying in 15s…"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"; exit 1

      - name: Run E2E tests (builds + serves the app)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
