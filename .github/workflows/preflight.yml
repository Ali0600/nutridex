name: Preflight

# Dogfoods the Preflight GitHub Action cross-repo (subdirectory action from
# Ali0600/preflight): diffs the PR's dependency changes, posts a sticky comment
# with per-dependency verdicts, and fails on violations of preflight.config.json.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write # upload the SARIF to the Security tab

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Ali0600/preflight/packages/action@abce9bea9e1adbf2633a46f230c3cbeed379f901 # v1
        with:
          node-version: '22'
          policy-file: preflight.config.json
      - name: Upload findings to the Security tab
        if: always() && hashFiles('preflight.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: preflight.sarif
