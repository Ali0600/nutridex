name: Preflight (scheduled)

# Catch CVEs disclosed *after* a dependency was merged: re-scan every committed
# manifest weekly and open/update a tracking issue with anything newly vulnerable.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  scan:
    name: Scan committed manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Ali0600/preflight/packages/action@abce9bea9e1adbf2633a46f230c3cbeed379f901 # v1
        with:
          mode: repo
          node-version: '22'
          # Report every finding to the tracking issue, but only turn this weekly run RED on an
          # actively-exploited CVE (CISA KEV) — not on the pile of high-but-unexploited advisories a
          # real app inevitably accrues in already-merged deps (which are the "trains you to ignore
          # it" antipattern when they keep a cron permanently red). The PR gate (preflight.yml,
          # policy-file) stays strict on anything NEW; this only tunes the scheduled scan's alarm.
          fail-level: kev
      - name: Upload findings to the Security tab
        if: always() && hashFiles('preflight.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: preflight.sarif
