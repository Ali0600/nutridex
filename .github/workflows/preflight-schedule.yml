name: Preflight (scheduled)

# Catch CVEs disclosed *after* a dependency was merged: re-scan every committed
# manifest weekly and open/update a tracking issue with anything newly vulnerable.
on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  scan:
    name: Scan committed manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Ali0600/preflight/packages/action@main
        with:
          mode: repo
          node-version: '22'
          # Report-only: a weekly cron scan gates nothing, and a known-but-unactionable CVE in an
          # already-merged dep (e.g. a transitive medium with no upstream fix yet) would leave this
          # run permanently red — the "trains you to ignore it" antipattern. The findings still land
          # in the tracking issue; the PR gate (preflight.yml, policy-file) stays strict on anything
          # NEW. See the Preflight docs' repo-mode notes.
          fail-on-cve: 'false'
      - name: Upload findings to the Security tab
        if: always() && hashFiles('preflight.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: preflight.sarif
